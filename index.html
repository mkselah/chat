<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat by Topic</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Top Auth Bar: only login/signup on this line -->
  <div id="authSection">
    <div id="authForm">
      <input id="authEmail" type="email" placeholder="Email" />
      <input id="authPassword" type="password" placeholder="Password" />
      <button id="loginBtn">Log In</button>
      <button id="signupBtn">Sign Up</button>
      <span id="authStatus"></span>
    </div>
    <!-- REMOVE: <button id="logoutBtn" style="display:none;">Log Out</button> -->
  </div>

  <!-- App Layout -->
  <div id="app" class="main-wrapper">

    <!-- Top Bar: sticky, shows topics & all actions, including logout -->
    <div id="topbar">
      <select id="topicDropdown"></select>
      <button id="addTopicBtn" title="New topic">+</button>
      <button id="renameTopicBtn" title="Rename topic">📝</button>
      <button id="deleteTopicBtn" title="Delete topic">🗑️</button>
      <button id="instructionsBtn" title="Topic instructions">⚙️</button>
      <span id="currentTopicLabel"></span>
      <span style="flex:1"></span>
      <label for="modelDropdown" style="margin-right:0.4em;">Model:</label>
      <select id="modelDropdown" style="min-width:110px;">
        <option value="claude-sonnet-5">claude-sonnet-5</option>
        <option value="claude-opus-5-5">claude-opus-5-5</option>
        <option value="gpt-5.5-2026-04-23">GPT5.5</option>
        <option value="gemini-3.8-flash">Gemini3.8Flash</option>
      </select>
      <button id="logoutBtn" style="display:none; margin-left:auto;">Log Out</button>
    </div>

    <main class="chat-section">
      <div id="chatWindow"></div>
      <form id="chatForm">
        <textarea id="userInput" autocomplete="off" placeholder="Type your message..." rows="1"></textarea>
        <button type="button" id="micBtn" title="Use voice input">🎤</button>
        <button id="showSheetBtn" type="button" title="Show Google Sheet Data">📄</button>
        <button id="dashboardBtn" type="button" title="Football skill dashboard">📈</button>
        <button type="submit">Send</button>
        <div id="sheetData" style="display:none; flex-basis:100%; flex-wrap:wrap; gap:6px; align-items:center; max-height:300px; overflow:auto; background:#f8faff; border:1px solid #bed8ff; margin:8px 0; padding:7px; border-radius:7px;"></div>
      </form>
    </main>
  </div>
  <!-- Football Dashboard popup -->
  <div id="dashboardPanel" style="display:none;">
    <div id="dashboardBox">
      <div id="dashboardHeader">
        <select id="dashColumn" title="Choose skill column"></select>
        <select id="dashColumn2" title="Compare with skill (optional)"></select>
        <select id="dashColumn3" title="Compare with skill (optional)"></select>
        <button id="dashAskBtn" type="button" title="Ask AI about this column">💬</button>
        <button id="dashCloseBtn" type="button" title="Close">✖</button>
      </div>
      <div id="dashStats"></div>
      <div id="dashChartWrap"><canvas id="dashChart"></canvas></div>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
